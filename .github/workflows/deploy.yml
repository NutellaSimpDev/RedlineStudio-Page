# Publishes public_html/ to Hostinger on every push to main.
# Setup (once): see docs/despliegue-hostinger.md.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'public_html/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp instead of a Node FTP client: Hostinger's FTP resets idle data
      # connections, and lftp reconnects and retries on its own.
      # mirror --reverse uploads public_html/ to the server; without --delete
      # it never removes anything on the server (subdomains, files uploaded
      # by hand). The password travels in LFTP_PASSWORD, never on the command
      # line, so special characters in it can't break the command.
      - name: Upload public_html to Hostinger
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.HOSTINGER_SERVER_DIR || '.' }}
        run: |
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" <<EOF
          set net:max-retries 6
          set net:reconnect-interval-base 5
          set net:timeout 30
          set ftp:passive-mode yes
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set mirror:parallel-transfer-count 1
          mirror --reverse --verbose --exclude-glob .git* ./public_html/ "$SERVER_DIR"
          bye
          EOF
